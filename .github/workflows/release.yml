name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
      platforms:
        description: Optional JSON matrix for rebuilding selected platforms (os, label, optional target)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms || '[{"os":"windows-2025","label":"windows-x64"},{"os":"macos-15","label":"macos-arm64"},{"os":"macos-15-intel","label":"macos-x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_DIR: ${{ matrix.target && format('src-tauri/target/{0}/release', matrix.target) || 'src-tauri/target/release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.target == ''
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings
        if: matrix.target == ''
      - run: npx tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Verify cross-compiled macOS architecture
        if: matrix.target == 'aarch64-apple-darwin'
        run: lipo "$RELEASE_DIR/bundle/macos/Codex Quota Dot.app/Contents/MacOS/codex-quota-dot" -verify_arch arm64
      - name: Prepare Windows assets and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "Codex-Quota-Dot-${{ inputs.tag || github.ref_name }}-${{ matrix.label }}"
          Compress-Archive -LiteralPath src-tauri/target/release/codex-quota-dot.exe,LICENSE,THIRD_PARTY_NOTICES.md -DestinationPath "$prefix-portable.zip"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) "$prefix-setup.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1) "$prefix.msi"
          Get-ChildItem "$prefix*" -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Set-Content ($_.FullName + ".sha256") -NoNewline
          }
      - name: Create macOS ZIP and checksum
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RELEASE_DIR/bundle/macos/Codex Quota Dot.app" "Codex-Quota-Dot-${{ inputs.tag || github.ref_name }}-${{ matrix.label }}.zip"
          shasum -a 256 "Codex-Quota-Dot-${{ inputs.tag || github.ref_name }}-${{ matrix.label }}.zip" > "Codex-Quota-Dot-${{ inputs.tag || github.ref_name }}-${{ matrix.label }}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body_path: docs/release-notes-${{ inputs.tag || github.ref_name }}.md
          files: |
            Codex-Quota-Dot-*
